root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o /tmp/server ./cmd/server"
  bin = "/tmp/server"
  full_bin = "/tmp/server"
  include_ext = ["go"]
  exclude_dir = ["web", "tmp", "node_modules", "bin", "docs", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  # Bind mount Windows tidak meneruskan file event ke container — wajib polling.
  poll = true
  poll_interval = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = false
